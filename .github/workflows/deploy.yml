name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]  # Déploiement automatique sur push main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: 🐍 Set up Python (for tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies (test only)
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: ✅ Run tests (optional)
        run: pytest || echo "⚠️ Tests failed or skipped, continuing deployment"

      - name: 🐳 Build Docker image
        run: |
          IMAGE="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/containers/${{ secrets.GCP_SERVICE_NAME }}:latest"
          echo "🔨 Building $IMAGE"
          gcloud builds submit --tag "$IMAGE"

      - name: 🚀 Deploy to Cloud Run
        run: |
          IMAGE="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/containers/${{ secrets.GCP_SERVICE_NAME }}:latest"
          echo "🚀 Deploying $IMAGE to Cloud Run"
          gcloud run deploy ${{ secrets.GCP_SERVICE_NAME }} \
            --image "$IMAGE" \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --timeout=900 \
            --set-env-vars ENVIRONMENT=production,GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},GOOGLE_CLOUD_REGION=${{ secrets.GCP_REGION }}
